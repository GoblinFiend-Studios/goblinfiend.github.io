<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Goblin Fiend Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:      #050a04;
      --deep:       #0a1208;
      --dark-green: #0f1f0c;
      --mid-green:  #1a3312;
      --slime:      #4a8c1c;
      --bright:     #6dbf2a;
      --glow:       #8fe84a;
      --text:       #c8d9b0;
      --muted:      #5a7040;
    }

    html, body {
      height: 100%;
      background-color: var(--black);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* === NOISE OVERLAY === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* === HERO === */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, #1a3a0a 0%, transparent 70%),
        var(--black);
    }

    /* drip border top */
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--slime), var(--bright), var(--slime), transparent);
      box-shadow: 0 0 18px var(--slime), 0 0 40px #2a5a0a;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 2rem;
    }

    .logo-wrap img {
      width: clamp(140px, 28vw, 260px);
      image-rendering: pixelated;
      filter: drop-shadow(0 0 18px #4a8c1c88) drop-shadow(0 0 40px #1a4a0a);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 18px #4a8c1c88) drop-shadow(0 0 40px #1a4a0a); }
      50%       { filter: drop-shadow(0 0 28px #6dbf2acc) drop-shadow(0 0 60px #2a6a0a); }
    }

    .studio-name {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: clamp(2.4rem, 7vw, 5rem);
      color: var(--bright);
      text-shadow:
        0 0 10px var(--slime),
        0 0 30px #2a5a0a,
        2px 2px 0 #0a1208;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1;
      margin-bottom: 0.6rem;
    }

    .tagline {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.7rem, 1.8vw, 1rem);
      color: var(--muted);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 3rem;
    }

    /* === COMING SOON BADGE === */
    .badge {
      display: inline-block;
      border: 1px solid var(--slime);
      color: var(--glow);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 0.5rem 1.4rem;
      position: relative;
      background: #0a1a0633;
      box-shadow: 0 0 12px #1a4a0a, inset 0 0 10px #0a1a0655;
      margin-bottom: 3.5rem;
    }

    .badge::before,
    .badge::after {
      content: '//';
      color: var(--slime);
      margin: 0 0.5rem;
      opacity: 0.7;
    }

    /* === SLIME BUBBLES === */
    .bubbles {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .bubble-wrap {
      position: relative;
      text-decoration: none;
      cursor: pointer;
      display: block;
    }

    .bubble-wrap canvas {
      display: block;
      filter: drop-shadow(0 0 14px #3a7a1466) drop-shadow(0 0 30px #1a4a0a33);
      transition: filter 0.3s;
    }

    .bubble-wrap:hover canvas {
      filter: drop-shadow(0 0 24px #6dbf2a88) drop-shadow(0 0 50px #2a6a0a55);
    }

    .bubble-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 8px var(--slime), 0 0 20px #1a4a0a;
      pointer-events: none;
      text-align: center;
      padding: 1rem;
    }

    /* === LINKS === */
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 0.5rem 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .links a:hover {
      color: var(--bright);
      border-color: var(--slime);
    }

    /* === FOOTER === */
    footer {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <section class="hero">

    <div class="bubbles">
      <a href="#" class="bubble-wrap" id="bubble-merch">
        <canvas width="220" height="220"></canvas>
        <span class="bubble-label" style="font-size:0.62rem;">Merchandise</span>
      </a>
      <a href="#" class="bubble-wrap" id="bubble-art">
        <canvas width="200" height="200"></canvas>
        <span class="bubble-label">Art</span>
      </a>
    </div>

    <div class="logo-wrap">
      <img src="GOBLINFIENDpixelLOGO4.png" alt="Goblin Fiend Studios Logo"/>
    </div>

    <h1 class="studio-name">Goblin Fiend Studios</h1>
    <p class="tagline">Indie Game Development & Art</p>

    <div class="badge">Something wicked this way comes</div>

    <nav class="links">
      <a href="https://www.youtube.com/@GoblinFiendStudios" target="_blank">YouTube</a>
      <a href="https://www.tiktok.com/@goblinfiend" target="_blank">TikTok</a>
      <a href="https://www.instagram.com/goblinfiend.studios" target="_blank">Instagram</a>
      <a href="https://x.com/GoblinFiend_Art" target="_blank">Twitter / X</a>
      <a href="https://soundcloud.com/goblinfiend" target="_blank">SoundCloud</a>
      <a href="#" style="opacity:0.4; cursor:not-allowed;">Spotify — Coming Soon</a>
    </nav>
  </section>

  <script>
    function createBlob(canvas, opts) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const cx = W / 2, cy = H / 2;
      const R = W * 0.34;
      const points = 10;
      let hueShift = opts.hueStart || 0;

      // Each bubble gets its own unique frequency/amplitude set
      const f = opts.freqs;
      const a = opts.amps;

      function blobPath(time) {
        const pts = [];
        for (let i = 0; i < points; i++) {
          const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
          const n1 = Math.sin(angle * f[0] + time * f[1]) * a[0];
          const n2 = Math.cos(angle * f[2] - time * f[3]) * a[1];
          const n3 = Math.sin(angle * f[4] + time * f[5]) * a[2];
          const n4 = Math.cos(angle * f[6] - time * f[7]) * a[3];
          const r = R * (1 + n1 + n2 + n3 + n4);
          pts.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
        }
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const p0 = pts[(i - 1 + pts.length) % pts.length];
          const p1 = pts[i];
          const p2 = pts[(i + 1) % pts.length];
          const p3 = pts[(i + 2) % pts.length];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          if (i === 0) ctx.moveTo(p1.x, p1.y);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        }
        ctx.closePath();
      }

      return function draw(time, hs) {
        hueShift = hs;
        ctx.clearRect(0, 0, W, H);

        blobPath(time);
        const base = ctx.createRadialGradient(cx - R*0.2, cy - R*0.25, R*0.05, cx, cy, R*1.15);
        base.addColorStop(0,   'rgba(45,100,10,0.93)');
        base.addColorStop(0.5, 'rgba(15,42,6,0.96)');
        base.addColorStop(1,   'rgba(4,12,2,0.98)');
        ctx.fillStyle = base;
        ctx.fill();

        blobPath(time);
        ctx.save();
        ctx.clip();
        const oil1 = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        oil1.addColorStop(0,   `hsla(${100 + hueShift % 360}, 80%, 45%, 0.00)`);
        oil1.addColorStop(0.2, `hsla(${160 + hueShift % 360}, 90%, 55%, 0.20)`);
        oil1.addColorStop(0.4, `hsla(${220 + hueShift % 360}, 80%, 50%, 0.14)`);
        oil1.addColorStop(0.6, `hsla(${280 + hueShift % 360}, 70%, 55%, 0.16)`);
        oil1.addColorStop(0.8, `hsla(${340 + hueShift % 360}, 85%, 50%, 0.11)`);
        oil1.addColorStop(1,   `hsla(${60  + hueShift % 360}, 90%, 60%, 0.00)`);
        ctx.fillStyle = oil1;
        ctx.fill();
        const oil2 = ctx.createLinearGradient(cx + R, cy - R, cx - R, cy + R);
        oil2.addColorStop(0,   `hsla(${200 + hueShift*0.5 % 360}, 70%, 50%, 0.00)`);
        oil2.addColorStop(0.3, `hsla(${260 + hueShift*0.5 % 360}, 80%, 60%, 0.14)`);
        oil2.addColorStop(0.6, `hsla(${320 + hueShift*0.5 % 360}, 75%, 55%, 0.11)`);
        oil2.addColorStop(1,   `hsla(${20  + hueShift*0.5 % 360}, 80%, 50%, 0.00)`);
        ctx.fillStyle = oil2;
        ctx.fill();
        ctx.restore();

        blobPath(time);
        ctx.strokeStyle = 'rgba(85,190,32,0.60)';
        ctx.lineWidth = 2;
        ctx.stroke();
        blobPath(time);
        ctx.strokeStyle = 'rgba(55,130,18,0.15)';
        ctx.lineWidth = 9;
        ctx.stroke();

        blobPath(time);
        ctx.save();
        ctx.clip();
        const shine = ctx.createRadialGradient(cx - R*0.28, cy - R*0.32, 1, cx - R*0.18, cy - R*0.22, R*0.52);
        shine.addColorStop(0,   'rgba(255,255,255,0.24)');
        shine.addColorStop(0.4, 'rgba(210,255,160,0.08)');
        shine.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.fillStyle = shine;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - R*0.26, cy - R*0.28, R*0.09, R*0.05, -0.5, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.30)';
        ctx.fill();
        ctx.restore();
      };
    }

    const blobs = [];
    const bubbleConfigs = [
      {
        // Merchandise — slower, broader warps
        hueStart: 20,
        freqs: [2.0, 0.55, 3.1, 0.38, 1.7, 0.82, 4.2, 0.27],
        amps:  [0.10, 0.08, 0.06, 0.09],
        wobbleSpeed: 0.85,
        wobbleAmp: 7,
        wobblePhase: 0,
      },
      {
        // Art — faster, more erratic
        hueStart: 140,
        freqs: [1.5, 0.73, 2.7, 0.61, 3.8, 0.44, 1.2, 0.95],
        amps:  [0.09, 0.11, 0.07, 0.06],
        wobbleSpeed: 1.15,
        wobbleAmp: 9,
        wobblePhase: 2.1,
      },
    ];

    document.querySelectorAll('.bubble-wrap').forEach((wrap, i) => {
      const canvas = wrap.querySelector('canvas');
      const cfg = bubbleConfigs[i];
      const drawFn = createBlob(canvas, cfg);
      blobs.push({ wrap, drawFn, cfg });
    });

    let globalT = 0;
    let globalHue = 0;

    function masterLoop() {
      globalT += 0.010;
      globalHue += 0.35;

      blobs.forEach(({ wrap, drawFn, cfg }) => {
        const y = Math.sin(globalT * cfg.wobbleSpeed + cfg.wobblePhase) * cfg.wobbleAmp;
        wrap.style.transform = `translateY(${y}px)`;
        drawFn(globalT, globalHue + cfg.hueStart);
      });

      requestAnimationFrame(masterLoop);
    }

    requestAnimationFrame(masterLoop);
  </script>

  <footer>© 2026 Goblin Fiend Studios — goblinfiend.com</footer>

</body>
</html>
