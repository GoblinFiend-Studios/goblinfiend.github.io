<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="apple-touch-icon" href="GOBLINFIENDpixelLOGO4.png"/>

  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:      #050a04;
      --deep:       #0a1208;
      --dark-green: #0f1f0c;
      --mid-green:  #1a3312;
      --slime:      #4a8c1c;
      --bright:     #6dbf2a;
      --glow:       #8fe84a;
      --text:       #c8d9b0;
      --muted:      #5a7040;
    }

    html, body {
      height: 100%;
      background-color: var(--black);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* === NO SCROLL ON DESKTOP === */
    @media (min-width: 769px) {
      html, body { overflow: hidden; }
    }

    /* === NOISE OVERLAY === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* === HERO === */
    .hero {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4rem 2rem 5rem; /* top pad for counter, bottom pad for sticky nav */
      background:
        radial-gradient(ellipse 60% 50% at 50% 40%, #1a3a0a 0%, transparent 70%),
        var(--black);
    }

    /* === LOGO === */
    .logo-wrap {
      position: relative;
      margin-bottom: 1.5rem;
      display: inline-block;
    }

    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(74,140,28,0.6) 0%, rgba(26,74,10,0.35) 45%, transparent 72%);
      animation: glow-pulse 4s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .logo-wrap img {
      position: relative;
      z-index: 1;
      width: clamp(120px, 36vw, 240px);
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 16px rgba(74,140,28,0.7)) drop-shadow(0 0 36px rgba(26,74,10,0.9));
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(74,140,28,0.7))  drop-shadow(0 0 36px rgba(26,74,10,0.9)); }
      50%       { filter: drop-shadow(0 0 26px rgba(109,191,42,0.85)) drop-shadow(0 0 55px rgba(42,106,10,0.95)); }
    }

    /* === TEXT === */
    .studio-name {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: clamp(2rem, 7vw, 5rem);
      color: var(--bright);
      text-shadow: 0 0 10px var(--slime), 0 0 30px #2a5a0a, 2px 2px 0 #0a1208;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.65rem, 2.5vw, 0.9rem);
      color: var(--muted);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.2rem;
    }

    /* === BADGE === */
    .badge {
      display: inline-block;
      border: 1px solid var(--slime);
      color: var(--glow);
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.45rem, 3.2vw, 0.75rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      position: relative;
      background: #0a1a0633;
      box-shadow: 0 0 12px #1a4a0a, inset 0 0 10px #0a1a0655;
      margin-bottom: 1.5rem;
      white-space: nowrap;
    }

    .badge::before,
    .badge::after {
      content: '//';
      color: var(--slime);
      margin: 0 0.5rem;
      opacity: 0.7;
    }

    a.badge {
      text-decoration: none;
      cursor: pointer;
      transition: box-shadow 0.25s, border-color 0.25s;
    }

    a.badge:hover,
    a.badge:focus {
      border-color: var(--bright);
      box-shadow: 0 0 20px var(--slime), inset 0 0 14px #1a4a0a55;
      outline: none;
    }

    /* === SLIME BUBBLES === */
    .bubbles {
      display: flex;
      gap: 2rem;
      justify-content: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    @media (max-width: 480px) {
      .bubbles { gap: 1rem; margin-bottom: 1rem; }
    }

    .bubble-wrap {
      position: relative;
      text-decoration: none;
      cursor: pointer;
      display: block;
      will-change: transform;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .bubble-wrap canvas {
      display: block;
      filter: drop-shadow(0 0 14px #3a7a1466) drop-shadow(0 0 30px #1a4a0a33);
      transition: filter 0.3s;
      will-change: transform;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .bubble-wrap:hover canvas,
    .bubble-wrap:focus canvas {
      filter: drop-shadow(0 0 24px #6dbf2a88) drop-shadow(0 0 50px #2a6a0a55);
    }

    .bubble-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 8px var(--slime), 0 0 20px #1a4a0a;
      pointer-events: none;
      text-align: center;
      padding: 1rem;
      will-change: transform;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    /* === SOCIAL LINKS === */
    .links-wrapper {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      pointer-events: none;
      width: max-content;
      max-width: 95vw;
    }

    /* Fall back to in-flow when screen is too short (zoomed in / small) */
    @media (max-height: 850px) {
      .links-wrapper {
        position: relative;
        bottom: auto;
        left: auto;
        transform: none;
        margin-top: 1rem;
        padding-bottom: 1rem;
        width: 100%;
        max-width: 100%;
      }
    }

    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: nowrap;
      justify-content: center;
      pointer-events: all;
      width: 100%;
    }

    /* On very narrow screens, allow wrapping only when in-flow (not fixed) */
    @media (max-width: 480px) {
      .links-wrapper:not([style]) .links {
        flex-wrap: wrap;
      }
    }

    .links a {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.5rem, 1.8vw, 0.8rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 0.3rem 0;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .links a:hover,
    .links a:focus {
      color: var(--bright);
      border-color: var(--slime);
      outline: none;
    }

    /* === VIEWPORT-FIXED BOTTOM GLOW LINE === */
    .bottom-glow {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--slime), var(--bright), var(--slime), transparent);
      box-shadow: 0 0 18px var(--slime), 0 0 40px #2a5a0a;
      z-index: 200;
      pointer-events: none;
    }

    /* === VISITOR COUNTER === */
    .visitor-counter {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      z-index: 150;
      pointer-events: none;
    }

    .counter-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.38rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0.7;
    }

    .counter-digits {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--slime);
      text-shadow: 0 0 6px var(--slime), 0 0 14px #2a5a0a;
      opacity: 0.85;
    }

    /* === MOBILE FINE-TUNING === */
    @media (max-width: 380px) {
      .studio-name { font-size: 1.9rem; }
      .tagline { letter-spacing: 0.18em; font-size: 0.6rem; }
      .badge { font-size: 0.55rem; letter-spacing: 0.18em; padding: 0.4rem 0.8rem; }
      .links { gap: 0.8rem; }
    }

    @media (max-width: 768px) {
      .hero { padding-top: 3.5rem; padding-bottom: 4.5rem; }
    }

  </style>

  <script>
    // === RESPONSIVE BUBBLE SIZE ===
    function getBubbleSize(index) {
      const vw = window.innerWidth;
      if (vw <= 380) return index === 0 ? 120 : 110;
      if (vw <= 480) return index === 0 ? 145 : 130;
      if (vw <= 768) return index === 0 ? 175 : 160;
      return index === 0 ? 220 : 200;
    }

    function setupCanvas(canvas, size) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width  = size + 'px';
      canvas.style.height = size + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      return { ctx, size };
    }

    function createBlob(canvas, opts, size) {
      let { ctx } = setupCanvas(canvas, size);
      let W = size, H = size;
      let cx = W / 2, cy = H / 2;
      let R = W * 0.34;
      const points = 10;
      let hueShift = opts.hueStart || 0;
      const f = opts.freqs;
      const a = opts.amps;

      function blobPath(time) {
        const pts = [];
        for (let i = 0; i < points; i++) {
          const angle = (i / points) * Math.PI * 2 - Math.PI / 2;
          const n1 = Math.sin(angle * f[0] + time * f[1]) * a[0];
          const n2 = Math.cos(angle * f[2] - time * f[3]) * a[1];
          const n3 = Math.sin(angle * f[4] + time * f[5]) * a[2];
          const n4 = Math.cos(angle * f[6] - time * f[7]) * a[3];
          const r = R * (1 + n1 + n2 + n3 + n4);
          pts.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
        }
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const p0 = pts[(i - 1 + pts.length) % pts.length];
          const p1 = pts[i];
          const p2 = pts[(i + 1) % pts.length];
          const p3 = pts[(i + 2) % pts.length];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          if (i === 0) ctx.moveTo(p1.x, p1.y);
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
        }
        ctx.closePath();
      }

      // Resize support — rebuild internal state when screen changes
      function resize(newSize) {
        W = newSize; H = newSize;
        cx = W / 2; cy = H / 2;
        R = W * 0.34;
        const setup = setupCanvas(canvas, newSize);
        ctx = setup.ctx;
      }

      function draw(time, hs) {
        hueShift = hs;
        ctx.clearRect(0, 0, W, H);

        blobPath(time);
        const base = ctx.createRadialGradient(cx - R*0.2, cy - R*0.25, R*0.05, cx, cy, R*1.15);
        base.addColorStop(0,   'rgba(45,100,10,0.93)');
        base.addColorStop(0.5, 'rgba(15,42,6,0.96)');
        base.addColorStop(1,   'rgba(4,12,2,0.98)');
        ctx.fillStyle = base;
        ctx.fill();

        blobPath(time);
        ctx.save();
        ctx.clip();
        const oil1 = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
        oil1.addColorStop(0,   `hsla(${100 + hueShift % 360}, 80%, 45%, 0.00)`);
        oil1.addColorStop(0.2, `hsla(${160 + hueShift % 360}, 90%, 55%, 0.20)`);
        oil1.addColorStop(0.4, `hsla(${220 + hueShift % 360}, 80%, 50%, 0.14)`);
        oil1.addColorStop(0.6, `hsla(${280 + hueShift % 360}, 70%, 55%, 0.16)`);
        oil1.addColorStop(0.8, `hsla(${340 + hueShift % 360}, 85%, 50%, 0.11)`);
        oil1.addColorStop(1,   `hsla(${60  + hueShift % 360}, 90%, 60%, 0.00)`);
        ctx.fillStyle = oil1;
        ctx.fill();
        const oil2 = ctx.createLinearGradient(cx + R, cy - R, cx - R, cy + R);
        oil2.addColorStop(0,   `hsla(${200 + hueShift*0.5 % 360}, 70%, 50%, 0.00)`);
        oil2.addColorStop(0.3, `hsla(${260 + hueShift*0.5 % 360}, 80%, 60%, 0.14)`);
        oil2.addColorStop(0.6, `hsla(${320 + hueShift*0.5 % 360}, 75%, 55%, 0.11)`);
        oil2.addColorStop(1,   `hsla(${20  + hueShift*0.5 % 360}, 80%, 50%, 0.00)`);
        ctx.fillStyle = oil2;
        ctx.fill();
        ctx.restore();

        blobPath(time);
        ctx.strokeStyle = 'rgba(85,190,32,0.60)';
        ctx.lineWidth = 2;
        ctx.stroke();
        blobPath(time);
        ctx.strokeStyle = 'rgba(55,130,18,0.15)';
        ctx.lineWidth = 9;
        ctx.stroke();

        blobPath(time);
        ctx.save();
        ctx.clip();
        const shine = ctx.createRadialGradient(cx - R*0.28, cy - R*0.32, 1, cx - R*0.18, cy - R*0.22, R*0.52);
        shine.addColorStop(0,   'rgba(255,255,255,0.24)');
        shine.addColorStop(0.4, 'rgba(210,255,160,0.08)');
        shine.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.fillStyle = shine;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - R*0.26, cy - R*0.28, R*0.09, R*0.05, -0.5, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.30)';
        ctx.fill();
        ctx.restore();
      }

      return { draw, resize };
    }

    const blobs = [];
    const bubbleConfigs = [
      {
        hueStart: 20,
        freqs: [2.0, 0.55, 3.1, 0.38, 1.7, 0.82, 4.2, 0.27],
        amps:  [0.10, 0.08, 0.06, 0.09],
        wobbleSpeed: 0.85, wobbleAmp: 7, wobblePhase: 0,
      },
      {
        hueStart: 140,
        freqs: [1.5, 0.73, 2.7, 0.61, 3.8, 0.44, 1.2, 0.95],
        amps:  [0.09, 0.11, 0.07, 0.06],
        wobbleSpeed: 1.15, wobbleAmp: 9, wobblePhase: 2.1,
      },
    ];

    document.querySelectorAll('.bubble-wrap').forEach((wrap, i) => {
      const canvas = wrap.querySelector('canvas');
      const size = getBubbleSize(i);
      const cfg = bubbleConfigs[i];
      const blob = createBlob(canvas, cfg, size);
      blobs.push({ wrap, blob, cfg, index: i });
    });

    // === RESIZE: rebuild canvases on orientation/window change ===
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        blobs.forEach(({ blob, index }) => {
          blob.resize(getBubbleSize(index));
        });
      }, 150);
    });

    // === ANIMATION LOOP ===
    let globalT = 0;
    let globalHue = 0;
    let rafId = null;
    let lastTime = null;

    function masterLoop(timestamp) {
      if (lastTime === null) lastTime = timestamp;
      const delta = Math.min(timestamp - lastTime, 33) / 1000;
      lastTime = timestamp;

      globalT   += delta * 0.8;
      globalHue += delta * 28;

      blobs.forEach(({ wrap, blob, cfg }) => {
        const y = Math.sin(globalT * cfg.wobbleSpeed + cfg.wobblePhase) * cfg.wobbleAmp;
        wrap.style.transform = `translate3d(0, ${y}px, 0)`;
        blob.draw(globalT, globalHue + cfg.hueStart);
      });

      rafId = requestAnimationFrame(masterLoop);
    }

    function startLoop() {
      if (rafId) cancelAnimationFrame(rafId);
      lastTime = null;
      rafId = requestAnimationFrame(masterLoop);
    }

    function stopLoop() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    // Pause when hidden, resume when visible (works on all browsers incl iOS)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopLoop(); else startLoop();
    });

    // iOS Safari may block rAF until user interacts
    document.addEventListener('touchstart', () => {
      if (!rafId) startLoop();
    }, { passive: true });

    startLoop();
  </script>

<script>

      const display = document.getElementById('counter-display');
      const GLITCH_CHARS = '0123456789';

      function pad(n) { return String(n).padStart(7, '0'); }
      function randomDigit() { return GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)]; }

      function glitchReveal(target) {
        const targetStr = pad(target);
        const len = targetStr.length;
        let locked = 0, frame = 0;
        display.textContent = Array.from({length: len}, () => randomDigit()).join('');
        const interval = setInterval(() => {
          frame++;
          let result = '';
          for (let i = 0; i < len; i++) {
            result += i < locked ? targetStr[i] : randomDigit();
          }
          display.textContent = result;
          if (frame % 6 === 0 && locked < len) locked++;
          if (locked >= len) { clearInterval(interval); display.textContent = targetStr; }
        }, 40);
      }

      function getVisitorId() {
        const KEY = 'gfs_visitor_id';
        let id = localStorage.getItem(KEY);
        if (!id) {
          id = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
          localStorage.setItem(KEY, id);
        }
        return id;
      }

      async function trackAndCount() {
        const visitorId = getVisitorId();
        const headers = {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        };
        await fetch(`${SUPABASE_URL}/rest/v1/visitors`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ visitor_id: visitorId })
        });
        const countRes = await fetch(`${SUPABASE_URL}/rest/v1/visitors?select=visitor_id`, {
          headers: { ...headers, 'Prefer': 'count=exact', 'Range': '0-0' }
        });
        const total = parseInt(countRes.headers.get('content-range')?.split('/')[1] || '0', 10);
