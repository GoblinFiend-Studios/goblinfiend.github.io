<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Art Shop — Goblin Fiend Studios</title>
  <link rel="icon" type="image/png" href="GOBLINFIENDpixelLOGO4.png"/>
  <link rel="apple-touch-icon" href="GOBLINFIENDpixelLOGO4.png"/>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:      #050a04;
      --deep:       #0a1208;
      --dark-green: #0f1f0c;
      --mid-green:  #1a3312;
      --slime:      #4a8c1c;
      --bright:     #6dbf2a;
      --glow:       #8fe84a;
      --text:       #c8d9b0;
      --muted:      #5a7040;
    }

    html, body {
      min-height: 100%;
      background-color: var(--black);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.4;
    }

    /* === HEADER === */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2rem;
      border-bottom: 1px solid var(--mid-green);
      background: linear-gradient(180deg, #0a1208cc, transparent);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(6px);
    }

    .back-link {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-link::before { content: '←'; font-family: monospace; }
    .back-link:hover { color: var(--bright); }

    .header-title {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: 1.5rem;
      color: var(--bright);
      text-shadow: 0 0 10px var(--slime), 0 0 28px #2a5a0a;
    }

    .header-right {
      width: 80px; /* balance the back link */
    }

    /* === PAGE HERO === */
    .page-hero {
      text-align: center;
      padding: 4rem 2rem 2.5rem;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, #1a3a0a44, transparent 80%);
      border-bottom: 1px solid var(--mid-green);
      position: relative;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--slime), var(--bright), var(--slime), transparent);
      box-shadow: 0 0 12px var(--slime);
    }

    .page-hero h1 {
      font-family: 'UnifrakturMaguntia', cursive;
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: var(--bright);
      text-shadow: 0 0 10px var(--slime), 0 0 30px #2a5a0a, 2px 2px 0 #0a1208;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .page-hero p {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* === GRID === */
    .shop-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 6rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1px;
      background: var(--mid-green);
      border: 1px solid var(--mid-green);
    }

    /* === PRODUCT CARD === */
    .product-card {
      background: var(--black);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.2s;
    }

    .product-card:hover { background: var(--deep); }

    .card-img {
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--dark-green);
      position: relative;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      opacity: 0.9;
      filter: saturate(0.85);
    }

    .product-card:hover .card-img img {
      transform: scale(1.05);
      opacity: 1;
      filter: saturate(1.1) drop-shadow(0 0 8px var(--slime));
    }

    /* slime shimmer on hover */
    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(74,140,28,0.12));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .product-card:hover .card-img::after { opacity: 1; }

    .card-body {
      padding: 1rem 1.25rem 1.4rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border-top: 1px solid var(--mid-green);
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text);
      line-height: 1.4;
    }

    .card-price {
      font-size: 0.78rem;
      color: var(--glow);
      letter-spacing: 0.1em;
    }

    .card-cta {
      margin-top: auto;
      padding-top: 0.8rem;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.2s, transform 0.2s, color 0.2s;
    }

    .product-card:hover .card-cta {
      opacity: 1;
      transform: translateY(0);
      color: var(--bright);
    }

    /* === STATES === */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 6rem 2rem;
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
    }

    /* Skeleton */
    .skel-card { background: var(--black); }
    .skel-img  { aspect-ratio: 1; background: var(--dark-green); animation: shimmer 1.6s ease-in-out infinite; }
    .skel-body { padding: 1rem 1.25rem; border-top: 1px solid var(--mid-green); }
    .skel-line { height: 10px; border-radius: 2px; background: var(--mid-green); animation: shimmer 1.6s ease-in-out infinite; margin-bottom: 0.5rem; }
    .skel-line.short { width: 35%; }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* === FOOTER === */
    footer {
      text-align: center;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      opacity: 0.5;
      padding-bottom: 2rem;
    }

    @media (max-width: 600px) {
      header { padding: 1rem 1.25rem; }
      .shop-container { padding: 2rem 0 4rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="back-link">Home</a>
    <span class="header-title">Goblin Fiend</span>
    <span class="header-right"></span>
  </header>

  <div class="page-hero">
    <h1>Art &amp; Merch</h1>
    <p>Printed on demand · Ships worldwide</p>
  </div>

  <div class="shop-container">
    <div class="product-grid" id="grid">
      <!-- skeletons while loading -->
      <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
      <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
      <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
      <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
    </div>
  </div>

  <footer>© 2026 Goblin Fiend Studios — goblinfiend.com</footer>

  <script>
    async function loadProducts() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error(`Error ${res.status}`);
        const products = await res.json();

        if (!products.length) {
          grid.innerHTML = `<div class="state-msg">// No products yet — something wicked this way comes //</div>`;
          return;
        }

        grid.innerHTML = products.map(p => `
          <a class="product-card" href="${p.url}" target="_blank" rel="noopener">
            <div class="card-img">
              ${p.image
                ? `<img src="${p.image}" alt="${p.title}" loading="lazy"/>`
                : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem;letter-spacing:.1em;">NO IMAGE</div>`
              }
            </div>
            <div class="card-body">
              <div class="card-title">${p.title}</div>
              <div class="card-price">$${(p.price / 100).toFixed(2)}</div>
              <div class="card-cta">View &amp; Order →</div>
            </div>
          </a>
        `).join('');

      } catch (err) {
        grid.innerHTML = `<div class="state-msg">// Failed to load products — ${err.message} //</div>`;
      }
    }

    loadProducts();
  </script>

</body>
</html>
